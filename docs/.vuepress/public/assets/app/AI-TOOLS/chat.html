<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatAI</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <style>
        /* ═══════════════════════════════════════════════════════════════
           Apple Design System tokens (reference: 苹果 Design Library)
           System Blue / system grays / HIG surfaces, light + dark
           ═══════════════════════════════════════════════════════════════ */
        :root {
            --background: #ffffff;
            --foreground: #1d1d1f;
            --card: #ffffff;
            --card-foreground: #1d1d1f;
            --primary: #007aff;
            --primary-foreground: #ffffff;
            --secondary: #f2f2f7;
            --secondary-foreground: #1d1d1f;
            --muted: #f2f2f7;
            --muted-foreground: #8e8e93;
            --accent: #f7f7fa;
            --accent-foreground: #1d1d1f;
            --destructive: #ff3b30;
            --success: #34c759;
            --border: #e5e5ea;
            --input: #d1d1d6;
            --ring: #007aff;
            --ring-soft: rgba(0, 122, 255, 0.10);
            --user-bubble: #007aff;
            --radius: 1.2rem;
            --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05);
            --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
        }

        [data-theme="dark"] {
            --background: #000000;
            --foreground: #f5f5f7;
            --card: #1c1c1e;
            --card-foreground: #f5f5f7;
            --primary: #2e8dff;
            --primary-foreground: #000000;
            --secondary: #1c1c1e;
            --secondary-foreground: #f5f5f7;
            --muted: #1c1c1e;
            --muted-foreground: #8e8e93;
            --accent: #2c2c2e;
            --accent-foreground: #f5f5f7;
            --destructive: #ff453a;
            --success: #30d158;
            --border: #3a3a3c;
            --input: #3a3a3c;
            --ring: #2e8dff;
            --ring-soft: rgba(46, 141, 255, 0.16);
            --user-bubble: #0a84ff;
            --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
            --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
            --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-sans);
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-size: 15px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* ── Sidebar ─────────────────────────────────────── */
        .sidebar {
            width: 280px;
            background-color: var(--secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: margin-left 0.25s ease;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .sidebar.hidden {
            margin-left: -280px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                z-index: 1000;
                height: 100%;
                box-shadow: var(--shadow-lg);
            }

            .header-left {
                gap: 10px;
            }

            .header-right {
                gap: 6px;
            }
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .sidebar-header {
            padding: 0 16px;
            background-color: var(--secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            height: 61px;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .sidebar-toggle-btn,
        .header-buttons button {
            background: none;
            border: none;
            color: var(--muted-foreground);
            font-size: 15px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }

        .sidebar-toggle-btn:hover,
        .header-buttons button:hover {
            background: var(--accent);
            color: var(--foreground);
            transform: scale(1.05);
        }

        .new-chat-btn {
            margin: 16px;
            height: 44px;
            padding: 0 20px;
            background: var(--primary);
            color: var(--primary-foreground);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            transition: filter 0.18s ease, transform 0.18s ease;
        }

        .new-chat-btn:hover {
            filter: brightness(0.94);
        }

        .new-chat-btn:active {
            transform: scale(0.97);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 12px 16px;
        }

        .chat-list::-webkit-scrollbar {
            width: 6px;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 999px;
        }

        .chat-item {
            padding: 11px 14px;
            margin: 4px 2px;
            border-radius: 14px;
            cursor: pointer;
            background: transparent;
            border: 1px solid transparent;
            transition: background-color 0.18s ease;
        }

        .chat-item:hover {
            background: var(--accent);
        }

        .chat-item.active {
            background: var(--ring-soft);
        }

        .chat-item-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .chat-item-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14.5px;
            flex: 1;
            min-width: 0;
        }

        .delete-chat-btn {
            background: none;
            border: none;
            color: var(--muted-foreground);
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.18s ease, background-color 0.18s ease, color 0.18s ease;
            flex-shrink: 0;
        }

        .chat-item:hover .delete-chat-btn {
            opacity: 1;
        }

        .delete-chat-btn:hover {
            background: var(--accent);
            color: var(--destructive);
        }

        /* ── Main header ─────────────────────────────────── */
        .main-header {
            padding: 0 20px;
            background-color: var(--secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            height: 61px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .header-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40%;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .header-center {
                display: none;
            }

            .header-left {
                gap: 10px;
            }

            .header-right {
                gap: 4px;
            }
        }

        .dropdown {
            position: relative;
            min-width: 210px;
        }

        .dropdown-toggle {
            width: 100%;
            height: 40px;
            padding: 0 16px;
            background: var(--card);
            color: var(--foreground);
            border: 1px solid var(--border);
            border-radius: 999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-xs);
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .dropdown-toggle:hover {
            border-color: var(--input);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            max-height: 360px;
            overflow-y: auto;
            z-index: 100;
            padding: 6px;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.15s ease;
        }

        .dropdown-item:hover {
            background: var(--accent);
        }

        /* ── Chat area ───────────────────────────────────── */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            background-color: var(--background);
            transition: background-color 0.2s ease;
        }

        .chat-area::-webkit-scrollbar {
            width: 8px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 999px;
        }

        .message {
            margin-bottom: 22px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: fadeInUp 0.2s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--secondary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted-foreground);
            font-size: 14px;
            font-weight: 600;
        }

        .message-avatar.ai-avatar {
            background: linear-gradient(135deg, var(--primary), #5856d6);
            border: none;
            color: #ffffff;
        }

        .message-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .message-user .message-content {
            align-items: flex-end;
        }

        .message-bubble {
            max-width: min(680px, 100%);
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.55;
            word-break: break-word;
        }

        .message-assistant .message-bubble {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-top-left-radius: 6px;
            box-shadow: var(--shadow-xs);
        }

        .message-user .message-bubble {
            background-color: var(--user-bubble);
            color: #ffffff;
            border-top-right-radius: 6px;
            box-shadow: var(--shadow-sm);
        }

        .message-actions {
            margin-top: 8px;
            display: flex;
            gap: 10px;
            align-self: flex-start;
        }

        .message-user .message-actions {
            align-self: flex-end;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--muted-foreground);
            cursor: pointer;
            font-size: 14px;
            padding: 5px 8px;
            border-radius: 8px;
            transition: background-color 0.18s ease, color 0.18s ease;
        }

        .action-btn:hover {
            background: var(--accent);
            color: var(--foreground);
        }

        /* ── Input area ──────────────────────────────────── */
        .input-area {
            padding: 14px 24px 18px;
            background-color: var(--secondary);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background-color: var(--card);
            color: var(--foreground);
            resize: none;
            min-height: 52px;
            max-height: 180px;
            font-size: 15px;
            line-height: 1.5;
            overflow-y: hidden;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--ring);
            box-shadow: 0 0 0 4px var(--ring-soft);
        }

        .message-input::placeholder {
            color: var(--muted-foreground);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            background-color: var(--primary);
            color: var(--primary-foreground);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
            transition: filter 0.18s ease, transform 0.18s ease;
        }

        .send-btn:hover {
            filter: brightness(0.92);
        }

        .send-btn:active {
            transform: scale(0.94);
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-style: italic;
            color: var(--muted-foreground);
            font-size: 14px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--muted-foreground);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.5;
            }

            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        .new-chat-btn-header,
        .theme-toggle {
            background-color: transparent;
            color: var(--muted-foreground);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }

        .new-chat-btn-header:hover,
        .theme-toggle:hover {
            background-color: var(--accent);
            color: var(--foreground);
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">ChatAI</div>
            <div class="header-buttons">
                <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="折叠侧边栏"><i
                        class="fas fa-chevron-left"></i></button>
                <button class="sidebar-clear-btn" id="sidebarClearBtn" title="清除所有会话"><i
                        class="fas fa-trash-alt"></i></button>
            </div>
        </div>
        <button class="new-chat-btn" id="newChatBtn"><i class="fas fa-plus"></i> <span>新建会话</span></button>
        <div class="chat-list" id="chatList"></div>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <div class="header-left">
                <button class="sidebar-toggle-btn" id="sidebarToggleBtn"><i class="fas fa-bars"></i></button>
                <div class="dropdown" id="modelDropdown">
                    <button class="dropdown-toggle">
                        <span id="selectedModel">OpenAI GPT-4o-mini</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-menu" id="modelMenu"></div>
                </div>
            </div>
            <div class="header-center" id="conversationTitle">新会话</div>
            <div class="header-right">
                <button class="theme-toggle" id="themeToggle" title="切换亮/暗模式"><i class="fas fa-adjust"></i></button>
                <button class="new-chat-btn-header" id="newChatBtnHeader" title="新建会话"><i
                        class="fas fa-plus"></i></button>
            </div>
        </header>

        <div class="chat-area" id="chatArea"></div>

        <footer class="input-area">
            <textarea class="message-input" id="messageInput" placeholder="输入消息开始对话..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </footer>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const allModels = [
                { name: "deepseek-reasoning", description: "DeepSeek R1 0528" },
                { name: "evil", description: "Evil (Uncensored)" },
                { name: "openai", description: "OpenAI GPT-4o-mini" },
                { name: "sur", description: "Sur AI Assistant" },
                { name: "unity", description: "Unity Unrestricted" },
                { name: "llama-roblox", description: "Llama 3.1 8B Instruct" },
                { name: "mistral", description: "Mistral Small 3.1 24B" }
            ];

            const elements = {
                sidebar: document.getElementById('sidebar'),
                sidebarToggleBtn: document.getElementById('sidebarToggleBtn'),
                sidebarCollapseBtn: document.getElementById('sidebarCollapseBtn'),
                sidebarClearBtn: document.getElementById('sidebarClearBtn'),
                modelDropdown: document.getElementById('modelDropdown'),
                selectedModel: document.getElementById('selectedModel'),
                modelMenu: document.getElementById('modelMenu'),
                chatArea: document.getElementById('chatArea'),
                messageInput: document.getElementById('messageInput'),
                sendBtn: document.getElementById('sendBtn'),
                newChatBtn: document.getElementById('newChatBtn'),
                newChatBtnHeader: document.getElementById('newChatBtnHeader'),
                chatList: document.getElementById('chatList'),
                themeToggle: document.getElementById('themeToggle'),
                conversationTitle: document.getElementById('conversationTitle')
            };

            let state = {
                currentModel: allModels.find(m => m.name === 'openai') || allModels[0],
                conversations: [],
                currentConversationId: null,
                chatCounter: 0,
                currentTheme: localStorage.getItem('theme') || 'dark',
                isAiTyping: false
            };

            const userAvatar = localStorage.getItem('userAvatarSVG') || (() => {
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#888888"/><circle cx="50" cy="35" r="18" fill="#ffffff"/><path d="M20 90 Q50 70 80 90 L80 100 L20 100 Z" fill="#ffffff"/></svg>`;
                const data = `data:image/svg+xml;base64,${btoa(svg)}`;
                localStorage.setItem('userAvatarSVG', data);
                return data;
            })();

            function setTheme(theme) {
                state.currentTheme = theme;
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);

                // 更新按钮图标
                elements.themeToggle.innerHTML = theme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            }

            function handleClickAnimation(element, callback) {
                // 添加按钮点击动画效果
                element.style.transition = 'all 0.3s ease';
                element.style.transform = 'scale(0.9)';

                setTimeout(() => {
                    element.style.transform = 'scale(1)';
                    if (callback) callback();
                }, 150);
            }

            function toggleSidebar() {
                elements.sidebar.classList.toggle('hidden');
            }

            function updateConversationTitle() {
                const conv = state.conversations.find(c => c.id === state.currentConversationId);
                elements.conversationTitle.textContent = conv ? conv.title : '新会话';
            }

            function populateModelDropdown() {
                elements.modelMenu.innerHTML = '';
                allModels.forEach(model => {
                    const item = document.createElement('div');
                    item.className = 'dropdown-item';
                    item.textContent = model.description;
                    item.onclick = () => {
                        state.currentModel = model;
                        elements.selectedModel.textContent = model.description;
                        elements.modelMenu.classList.remove('show');
                    };
                    elements.modelMenu.appendChild(item);
                });
            }

            function createNewConversation() {
                state.chatCounter++;
                const id = Date.now().toString();
                const conv = { id, title: `新会话 ${state.chatCounter}`, messages: [], timestamp: Date.now() };
                state.conversations.push(conv);
                state.currentConversationId = id;
                renderChatList();
                elements.chatArea.innerHTML = '';
                updateConversationTitle();
            }

            function renderChatList() {
                elements.chatList.innerHTML = '';
                state.conversations.slice().reverse().forEach(conv => {
                    const item = document.createElement('div');
                    item.className = 'chat-item' + (conv.id === state.currentConversationId ? ' active' : '');
                    item.innerHTML = `
                        <div class="chat-item-controls">
                            <div class="chat-item-title">${conv.title}</div>
                            <button class="delete-chat-btn" title="删除会话" data-id="${conv.id}"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    item.onclick = (e) => {
                        if (e.target.closest('.delete-chat-btn')) {
                            // 删除会话
                            const id = e.target.closest('.delete-chat-btn').dataset.id;
                            deleteConversation(id);
                            return;
                        }

                        state.currentConversationId = conv.id;
                        renderChatList();
                        renderMessages();
                        updateConversationTitle();
                    };
                    elements.chatList.appendChild(item);
                });
            }

            function deleteConversation(id) {
                if (state.conversations.length <= 1) {
                    alert('至少保留一个会话');
                    return;
                }

                // 确认删除
                if (!confirm('确定要删除这个会话吗？')) {
                    return;
                }

                // 从数组中移除
                state.conversations = state.conversations.filter(c => c.id !== id);

                // 如果删除的是当前会话，则切换到第一个会话
                if (state.currentConversationId === id) {
                    state.currentConversationId = state.conversations[0].id;
                    renderMessages();
                    updateConversationTitle();
                }

                renderChatList();
            }

            function getCurrentConv() {
                return state.conversations.find(c => c.id === state.currentConversationId);
            }

            function renderMessages() {
                const conv = getCurrentConv();
                if (!conv) return;
                elements.chatArea.innerHTML = '';
                conv.messages.forEach(msg => addMessageToArea(msg));
            }

            function addMessageToArea(msg) {
                const div = document.createElement('div');
                div.className = `message message-${msg.role}`;
                div.dataset.msgId = msg.id;

                const aiAvatarHtml = `<div class="message-avatar ai-avatar">AI</div>`;

                div.innerHTML = `
                    <div class="message-avatar">${msg.role === 'user' ? `<img src="${userAvatar}" alt="用户">` : aiAvatarHtml}</div>
                    <div class="message-content">
                        <div class="message-bubble">${DOMPurify.sanitize(marked.parse(msg.content))}</div>
                        <div class="message-actions">
                            <button class="action-btn copy-btn" title="复制"><i class="fas fa-copy"></i></button>
                        </div>
                    </div>
                `;
                elements.chatArea.appendChild(div);

                div.addEventListener('click', (e) => {
                    if (e.target.closest('.copy-btn')) {
                        navigator.clipboard.writeText(msg.content);
                    }
                });

                elements.chatArea.scrollTop = elements.chatArea.scrollHeight;
            }

            function addTyping() {
                if (document.getElementById('typing')) return;
                state.isAiTyping = true;
                const div = document.createElement('div');
                div.id = 'typing';
                div.className = 'message message-assistant';
                div.innerHTML = `
                    <div class="message-avatar ai-avatar">AI</div>
                    <div class="message-content">
                        <div class="message-bubble">
                            <div class="typing-indicator">
                                AI 正在思考
                                <div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>
                            </div>
                        </div>
                    </div>
                `;
                elements.chatArea.appendChild(div);
                elements.chatArea.scrollTop = elements.chatArea.scrollHeight;
            }

            function removeTyping() {
                const el = document.getElementById('typing');
                if (el) el.remove();
                state.isAiTyping = false;
            }

            async function sendMessage() {
                let input = elements.messageInput.value.trim();
                if (!input || state.isAiTyping) return;

                let conv = getCurrentConv();
                if (!conv) {
                    createNewConversation();
                    conv = getCurrentConv();
                }

                const userMsg = { id: Date.now().toString(), role: 'user', content: input };
                conv.messages.push(userMsg);
                addMessageToArea(userMsg);
                elements.messageInput.value = '';

                if (conv.messages.length === 1) {
                    conv.title = input.substring(0, 25) + (input.length > 25 ? '...' : '');
                    updateConversationTitle();
                    renderChatList();
                }

                addTyping();

                const history = conv.messages.slice(-12);
                let prompt = history.map(m => `${m.role === 'user' ? 'User' : 'Assistant'}: ${m.content}`).join('\n\n') + '\n\nAssistant:';
                const url = `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=${state.currentModel.name}`;

                try {
                    const resp = await fetch(url);
                    const text = await resp.text();
                    const aiMsg = { id: Date.now().toString(), role: 'assistant', content: text.trim() || '（无回应）' };
                    conv.messages.push(aiMsg);
                    addMessageToArea(aiMsg);
                } catch (e) {
                    const errMsg = { id: Date.now().toString(), role: 'assistant', content: '请求失败，请检查网络或模型。' };
                    conv.messages.push(errMsg);
                    addMessageToArea(errMsg);
                } finally {
                    removeTyping();
                }
            }

            // 初始化
            setTheme(state.currentTheme);
            populateModelDropdown();
            createNewConversation();

            // 事件绑定
            elements.themeToggle.onclick = () => setTheme(state.currentTheme === 'dark' ? 'light' : 'dark');
            elements.sidebarToggleBtn.onclick = () => {
                handleClickAnimation(elements.sidebarToggleBtn);
                toggleSidebar();
            };
            elements.sidebarCollapseBtn.onclick = () => {
                handleClickAnimation(elements.sidebarCollapseBtn);
                toggleSidebar();
            };
            elements.sidebarClearBtn.onclick = () => {
                handleClickAnimation(elements.sidebarClearBtn);
                if (confirm('确定要清除所有会话吗？')) {
                    state.conversations = [];
                    createNewConversation();
                    renderChatList();
                }
            };
            elements.newChatBtn.onclick = () => {
                handleClickAnimation(elements.newChatBtn);
                createNewConversation();
            };
            elements.newChatBtnHeader.onclick = () => {
                handleClickAnimation(elements.newChatBtnHeader);
                createNewConversation();
            };
            elements.sendBtn.onclick = () => {
                handleClickAnimation(elements.sendBtn);
                sendMessage();
            };
            elements.modelDropdown.querySelector('.dropdown-toggle').onclick = () => elements.modelMenu.classList.toggle('show');
            elements.messageInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            elements.messageInput.addEventListener('input', () => {
                elements.messageInput.style.height = 'auto';
                elements.messageInput.style.height = elements.messageInput.scrollHeight + 'px';
            });
        });
    </script>
</body>

</html>
